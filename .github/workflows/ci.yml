name: CI

on:
  push:
    branches:
      - main
      - test-implementation
      - dev
      - prod
  pull_request:
    branches:
      - main
      - test-implementation
      - dev
      - prod
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Core tests
        run: npm run test:core

      - name: API tests
        run: npm run test:api

      - name: Build
        run: npm run build
